<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Tarefa - 4D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #020617; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        
        .bg-grid {
            position: absolute; inset: 0; z-index: 0;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            perspective: 1000px;
        }
        
        .form-4d {
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 40px 100px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05);
            animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-50px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .input-dark { 
            background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255,255,255,0.1); color: #fff; transition: all 0.3s;
        }
        .input-dark:focus { background: rgba(0, 0, 0, 0.8); border-color: #3b82f6; box-shadow: 0 0 20px rgba(59, 130, 246, 0.2); outline: none; }
        
        /* Ajuste para o calendário do input date ficar visível */
        ::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
    </style>
</head>
<body class="p-6 relative">

    <div class="bg-grid"></div>

    <div class="form-4d w-full max-w-3xl p-10 md:p-12 rounded-3xl relative z-10">
        
        <div class="mb-10 border-b border-gray-800 pb-6">
            <h1 class="text-3xl font-bold text-white tracking-widest uppercase">Designar Tarefa</h1>
            <p class="text-cyan-500 mt-2 font-mono text-sm uppercase tracking-wider">Protocolo de Criação de Demanda</p>
        </div>

        {% if messages %}
            <div class="mb-8">
                {% for message in messages %}
                    <div class="p-4 bg-red-900/30 border border-red-500/50 text-red-400 rounded-lg text-sm font-bold uppercase tracking-widest">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST" class="space-y-8">
            {% csrf_token %}
            
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-3">Título da Operação</label>
                <input type="text" name="titulo" required class="input-dark w-full px-5 py-4 rounded-xl text-lg font-medium" placeholder="Ex: Refatorar API principal">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-3">Especificações</label>
                <textarea name="descricao" rows="4" required class="input-dark w-full px-5 py-4 rounded-xl resize-none font-medium" placeholder="Insira os dados técnicos..."></textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-3">Nível de Ameaça (Prioridade)</label>
                    <select name="prioridade" class="input-dark w-full px-5 py-4 rounded-xl font-bold uppercase tracking-widest appearance-none">
                        <option value="relevante">Relevante (Baixa)</option>
                        <option value="mediana">Mediana (Média)</option>
                        <option value="extrema" class="text-red-400">Extrema (Crítica)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-3">Prazo Limite</label>
                    <input type="date" name="data_entrega" required class="input-dark w-full px-5 py-4 rounded-xl font-mono uppercase">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-3">Agente Designado (Membro)</label>
                <select name="membro_atribuido" required class="input-dark w-full px-5 py-4 rounded-xl font-medium appearance-none">
                    <option value="" disabled selected>Selecione um alvo no setor...</option>
                    {% for membro in equipe %}
                        <option value="{{ membro.id }}">
                            {{ membro.username }} [Classe: {{ membro.get_cargo_display|upper }}]
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="flex flex-col-reverse sm:flex-row gap-5 pt-8 mt-4 border-t border-gray-800">
                <a href="{% url 'dashboard' %}" class="flex-1 py-4 px-6 bg-transparent border border-gray-600 text-gray-400 hover:text-white hover:border-white rounded-xl font-bold text-center uppercase tracking-widest transition-all">
                    Abortar
                </a>
                <button type="submit" class="flex-1 py-4 px-6 bg-cyan-600 hover:bg-cyan-500 text-black shadow-[0_0_20px_rgba(6,182,212,0.4)] hover:shadow-[0_0_30px_rgba(6,182,212,0.6)] rounded-xl font-bold uppercase tracking-widest transition-all transform hover:scale-[1.02]">
                    Confirmar Execução
                </button>
            </div>
        </form>
    </div>

</body>
</html>
