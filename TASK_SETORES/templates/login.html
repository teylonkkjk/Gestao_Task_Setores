<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TaskFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #030712; overflow: hidden; perspective: 1000px; }
        
        /* Orbs de Energia 4D no fundo */
        .orb { position: absolute; border-radius: 50%; filter: blur(120px); z-index: -1; opacity: 0.6; animation: float 20s infinite ease-in-out alternate; }
        .orb-1 { width: 50vw; height: 50vw; background: #4338ca; top: -20%; left: -10%; }
        .orb-2 { width: 40vw; height: 40vw; background: #0891b2; bottom: -10%; right: -10%; animation-delay: -5s; }
        
        @keyframes float { 
            0% { transform: translate(0, 0) scale(1) rotate(0deg); } 
            100% { transform: translate(100px, 150px) scale(1.2) rotate(45deg); } 
        }

        /* Vidro Escuro 4D */
        .glass-4d {
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.6s;
        }
        .glass-4d:hover { transform: translateZ(30px) rotateX(2deg) rotateY(-2deg); box-shadow: 0 40px 80px rgba(8, 145, 178, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.2); }

        .fade-in-z { animation: fadeInZ 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateZ(-100px) translateY(30px); }
        @keyframes fadeInZ { to { opacity: 1; transform: translateZ(0) translateY(0); } }
        
        .input-dark { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255,255,255,0.1); color: #fff; }
        .input-dark:focus { background: rgba(0, 0, 0, 0.6); border-color: #06b6d4; box-shadow: 0 0 15px rgba(6, 182, 212, 0.3); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen text-gray-200">

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="glass-4d w-full max-w-md p-10 rounded-3xl fade-in-z relative z-10">
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-indigo-500 to-cyan-500 text-white mb-6 shadow-[0_0_30px_rgba(99,102,241,0.5)] transform translate-z-10">
                <svg class="w-10 h-10 drop-shadow-lg" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <h1 class="text-4xl font-bold text-white tracking-wider uppercase" style="text-shadow: 0 0 20px rgba(255,255,255,0.2);">TaskFlow</h1>
            <p class="text-cyan-400 mt-2 font-medium tracking-widest text-sm uppercase">Acesso Restrito</p>
        </div>
        
        {% if messages %}
            <div class="mb-6 transform translate-z-10">
                {% for message in messages %}
                    <div class="p-4 bg-red-900/50 text-red-300 rounded-xl text-sm font-bold border border-red-500/50 shadow-[0_0_15px_rgba(239,68,68,0.3)] text-center animate-pulse">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST" class="space-y-6 transform translate-z-10">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Usuário</label>
                <input type="text" name="username" required class="input-dark w-full px-5 py-4 rounded-xl outline-none transition-all duration-300 placeholder-gray-600" placeholder="Digite sua credencial">
            </div>
            
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Senha</label>
                <input type="password" name="password" required class="input-dark w-full px-5 py-4 rounded-xl outline-none transition-all duration-300 placeholder-gray-600" placeholder="••••••••">
            </div>
            
            <button type="submit" class="w-full mt-4 py-4 px-4 bg-white text-black rounded-xl font-bold text-lg shadow-[0_0_20px_rgba(255,255,255,0.3)] hover:shadow-[0_0_30px_rgba(255,255,255,0.6)] hover:bg-gray-100 transform hover:-translate-y-1 transition-all duration-300 uppercase tracking-wider">
                Iniciar Sessão
            </button>
        </form>
    </div>
</body>
</html>
